<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>网页制造</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b10;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #05000c;
  }
  .menu {
    display: none;
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }
  .menu h1 {
    margin-bottom: 24px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    text-align: center;
    color: #ffffff;
  }
  .menu a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 18px 20px;
    border: 1px solid #23232f;
    border-radius: 14px;
    background: #16161f;
    color: #e8e8f0;
    font-size: 15px;
    letter-spacing: 1px;
    text-decoration: none;
  }
  .menu a::after {
    content: '→';
    color: #6d6d85;
  }
  .menu a:active { background: #1e1e2a; }
  .menu a.pending {
    opacity: .45;
    pointer-events: none;
  }
  .menu a.pending::after {
    content: '待开发';
    font-size: 12px;
  }
</style>
</head>
<body>
<iframe id="view" allow="autoplay" scrolling="no"></iframe>
<div class="menu" id="menu">
  <h1>网页制造</h1>
  <div id="list"></div>
</div>
<script>
(function () {
  'use strict';

  var MODULES = [
    { id: 'wish', name: '祝福', path: '祝福/index.html', ready: true },
    { id: 'game', name: '游戏', path: '游戏/index.html', ready: true },
    { id: 'mem', name: '纪念', path: '纪念/index.html', ready: false }
  ];

  var view = document.getElementById('view');
  var menu = document.getElementById('menu');
  var list = document.getElementById('list');
  var initialP = new URLSearchParams(window.location.search).get('p');
  var i;

  for (i = 0; i < MODULES.length; i++) {
    var item = MODULES[i];
    var a = document.createElement('a');
    a.textContent = item.name;
    if (item.ready) {
      a.href = '?m=' + item.id;
    } else {
      a.className = 'pending';
    }
    list.appendChild(a);
  }

  /* iframe 导航用 location.replace()，避免产生多余历史条目
     （否则浏览器返回键要按两次：先退 iframe 再退根地址） */
  function loadView(url) {
    try {
      if (url) {
        view.contentWindow.location.replace(url);
        view.style.display = 'block';
      } else {
        view.contentWindow.location.replace('about:blank');
        view.style.display = 'none';
      }
    } catch (e) {
      if (url) view.src = url;
      else view.removeAttribute('src');
      view.style.display = url ? 'block' : 'none';
    }
  }

  function route() {
    var sp = new URLSearchParams(window.location.search);
    var m = sp.get('m');
    var p = sp.get('p');
    var current = null;

    for (var j = 0; j < MODULES.length; j++) {
      if (MODULES[j].id === m) current = MODULES[j];
    }

    if (current && current.ready) {
      document.title = current.name;
      menu.style.display = 'none';
      /* 初始 URL 就带 p = 分享直达链接，透传 direct 让子页面隐藏返回按钮（封闭体验）；
         从菜单点进来的 p 与初始不同（或初始无 p），保持可返回 */
      var direct = initialP && p === initialP;
      loadView(current.path + (p ? ('?p=' + encodeURIComponent(p)) : '') + (direct ? '&direct=1' : ''));
    } else {
      document.title = '网页制造';
      loadView(null);
      menu.style.display = 'block';
    }
  }

  /* 供子页面调用（跨 iframe 层级，统一走 postMessage） */
  window.addEventListener('message', function (e) {
    if (e.origin !== window.location.origin) return;
    if (e.data && typeof e.data.nav === 'string') {
      window.__nav(e.data.nav);
    }
  });

  /* 直调入口（同层 iframe 可用） */
  window.__nav = function (query) {
    window.history.pushState(null, '', window.location.pathname + (query || ''));
    route();
  };

  window.addEventListener('popstate', route);
  route();
})();
</script>
</body>
</html>
