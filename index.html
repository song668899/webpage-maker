<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>网页制造</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b10;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #05000c;
  }
  .menu {
    display: none;
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }
  .menu h1 {
    margin-bottom: 24px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    text-align: center;
    color: #ffffff;
  }
  .menu a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 18px 20px;
    border: 1px solid #23232f;
    border-radius: 14px;
    background: #16161f;
    color: #e8e8f0;
    font-size: 15px;
    letter-spacing: 1px;
    text-decoration: none;
  }
  .menu a::after {
    content: '→';
    color: #6d6d85;
  }
  .menu a:active { background: #1e1e2a; }
  .menu a.pending {
    opacity: .45;
    pointer-events: none;
  }
  .menu a.pending::after {
    content: '待开发';
    font-size: 12px;
  }
</style>
</head>
<body>
<iframe id="view" allow="autoplay" scrolling="no"></iframe>
<div class="menu" id="menu">
  <h1>网页制造</h1>
  <div id="list"></div>
</div>
<script>
(function () {
  'use strict';

  var MODULES = [
    { id: 'love', name: '表白', path: '表白/index.html', ready: true },
    { id: 'wish', name: '祝福', path: '祝福/index.html', ready: false },
    { id: 'game', name: '游戏', path: '游戏/index.html', ready: true }
  ];

  var id = new URLSearchParams(window.location.search).get('m');
  var view = document.getElementById('view');
  var menu = document.getElementById('menu');
  var list = document.getElementById('list');
  var current = null;
  var i;

  for (i = 0; i < MODULES.length; i++) {
    if (MODULES[i].id === id) current = MODULES[i];
  }

  if (current && current.ready) {
    document.title = current.name;
    view.src = current.path;
    view.style.display = 'block';
    return;
  }

  menu.style.display = 'block';
  for (i = 0; i < MODULES.length; i++) {
    var item = MODULES[i];
    var a = document.createElement('a');
    a.textContent = item.name;
    if (item.ready) {
      a.href = '?m=' + item.id;
    } else {
      a.className = 'pending';
    }
    list.appendChild(a);
  }
})();
</script>
</body>
</html>
